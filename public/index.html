<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Tool - Project Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #667eea;
            font-size: 1.5em;
        }

        .chat-container {
            grid-column: 1 / -1;
        }

        #chatMessages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fafbfc;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            max-width: 80%;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .message.assistant {
            background: #e9ecef;
            color: #333;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message-label {
            font-size: 0.85em;
            opacity: 0.8;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .list-item {
            padding: 12px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge.high { background: #fee; color: #c00; }
        .badge.medium { background: #fef3cd; color: #856404; }
        .badge.low { background: #d4edda; color: #155724; }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .quick-action-btn {
            padding: 8px 16px;
            background: #f8f9fa;
            color: #667eea;
            border: 1px solid #667eea;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-action-btn:hover {
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🚀 PM Tool</h1>
            <p>Project Management powered by Claude AI</p>
        </div>
    </header>

    <div class="container">
        <!-- Statistics -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="userCount">-</div>
                <div class="stat-label">Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="projectCount">-</div>
                <div class="stat-label">Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="boardCount">-</div>
                <div class="stat-label">Boards</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="taskCount">-</div>
                <div class="stat-label">Tasks</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Chat Interface -->
            <div class="card chat-container">
                <h2>💬 AI Assistant</h2>
                <div id="chatMessages"></div>
                <div class="quick-actions">
                    <button class="quick-action-btn" onclick="setQuickMessage('List all users')">List Users</button>
                    <button class="quick-action-btn" onclick="setQuickMessage('List all projects')">List Projects</button>
                    <button class="quick-action-btn" onclick="setQuickMessage('Show me all tasks')">Show Tasks</button>
                    <button class="quick-action-btn" onclick="setQuickMessage('Create a new user')">New User</button>
                </div>
                <div class="input-group">
                    <input type="text" id="chatInput" placeholder="Type your request in natural language..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>

            <!-- Recent Projects -->
            <div class="card">
                <h2>📊 Recent Projects</h2>
                <div id="projectsList"></div>
            </div>

            <!-- Recent Tasks -->
            <div class="card">
                <h2>✅ Recent Tasks</h2>
                <div id="tasksList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Load dashboard data
        async function loadDashboard() {
            try {
                // Load stats
                const usersRes = await fetch(`${API_URL}/users`);
                const usersData = await usersRes.json();
                document.getElementById('userCount').textContent = usersData.users?.length || 0;

                const projectsRes = await fetch(`${API_URL}/projects`);
                const projectsData = await projectsRes.json();
                document.getElementById('projectCount').textContent = projectsData.projects?.length || 0;

                const boardsRes = await fetch(`${API_URL}/boards`);
                const boardsData = await boardsRes.json();
                document.getElementById('boardCount').textContent = boardsData.boards?.length || 0;

                const tasksRes = await fetch(`${API_URL}/tasks`);
                const tasksData = await tasksRes.json();
                document.getElementById('taskCount').textContent = tasksData.tasks?.length || 0;

                // Load recent projects
                const projectsList = document.getElementById('projectsList');
                if (projectsData.projects && projectsData.projects.length > 0) {
                    projectsList.innerHTML = projectsData.projects.slice(0, 5).map(p => `
                        <div class="list-item">
                            <div>
                                <strong>${p.name}</strong><br>
                                <small>${p.owner_name || 'No owner'} • ${p.member_count || 0} members</small>
                            </div>
                        </div>
                    `).join('');
                } else {
                    projectsList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📂</div><div>No projects yet</div></div>';
                }

                // Load recent tasks
                const tasksList = document.getElementById('tasksList');
                if (tasksData.tasks && tasksData.tasks.length > 0) {
                    tasksList.innerHTML = tasksData.tasks.slice(0, 5).map(t => `
                        <div class="list-item">
                            <div>
                                <strong>${t.title}</strong><br>
                                <small>${t.list_name || 'No list'} • ${t.assignee_name || 'Unassigned'}</small>
                            </div>
                            <span class="badge ${t.priority}">${t.priority}</span>
                        </div>
                    `).join('');
                } else {
                    tasksList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✓</div><div>No tasks yet</div></div>';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Chat functionality
        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = sender === 'user' ? 'You' : 'AI Assistant';

            const content = document.createElement('div');
            content.textContent = text;

            messageDiv.appendChild(label);
            messageDiv.appendChild(content);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addLoadingMessage() {
            const messagesDiv = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant loading';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = '<div class="spinner"></div> Thinking...';
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeLoadingMessage() {
            const loading = document.getElementById('loadingMessage');
            if (loading) loading.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();

            if (!message) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            addMessage(message, 'user');
            input.value = '';
            addLoadingMessage();

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                removeLoadingMessage();

                if (data.success) {
                    addMessage(data.response || 'Action completed successfully', 'assistant');
                    // Reload dashboard to show updates
                    setTimeout(loadDashboard, 500);
                } else {
                    addMessage(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                removeLoadingMessage();
                addMessage(`Error: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function setQuickMessage(message) {
            document.getElementById('chatInput').value = message;
            document.getElementById('chatInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Initialize
        loadDashboard();

        // Add welcome message
        setTimeout(() => {
            addMessage('Hello! I\'m your PM assistant. Ask me anything about your projects, boards, tasks, or team members. You can use natural language like "Create a new project" or "Show me all tasks assigned to user 1".', 'assistant');
        }, 500);

        // Refresh dashboard every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
